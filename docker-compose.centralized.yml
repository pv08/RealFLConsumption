# Treino centralizado (clientes individuais + comunidade) dentro do container.
#
# Opcao A: UM container rodando o lote inteiro, com o paralelismo controlado
# pelo -jobs do run_centralized.sh. A GPU e uma so, entao subir um container por
# cliente nao compraria paralelismo nenhum - so jogaria fora a retomada, a
# retentativa de OOM e a trava por job que vivem no runner.
#
# Usa a MESMA imagem do federado (fl-simulation-img, torch 2.9.1+cu128) de
# proposito: assim os dois lados da comparacao do artigo saem da mesma pilha.
#
# Uso (preferir o wrapper, que repassa os argumentos):
#   bash run_centralized_docker.sh -loc all -bootstrap -jobs 3
#   bash run_centralized_docker.sh -loc austin -models "rnn" -epochs 10
#
# Ou direto, com os defaults do command abaixo:
#   docker compose -f docker-compose.centralized.yml up --build
services:
  centralized:
    build:
      context: .
      dockerfile: Dockerfile
    image: fl-simulation-img
    runtime: nvidia
    # Sem container_name: `docker compose run` gera um nome proprio, o que
    # permite mais de uma invocacao sem colisao.
    volumes:
      # etc/ recebe os artefatos e os logs por job (etc/in/_runlogs/...).
      - ./etc:/app/etc
      # ATENCAO: leitura E escrita, ao contrario do servico de cliente federado
      # que monta :ro. O -bootstrap escreve aqui: build_community_dataset.py
      # grava os community.csv e migrate_data_numpy.py grava os .npy.
      - ./dataset:/app/dataset
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      # seed_all liga torch.use_deterministic_algorithms(True).
      - CUBLAS_WORKSPACE_CONFIG=:4096:8
      - PYTORCH_ALLOC_CONF=expandable_segments:True
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - OMP_NUM_THREADS=1
      - MALLOC_ARENA_MAX=2
      # O runner tem como default o python do conda do host, que nao existe aqui.
      - PYTHON=python
      # Com user 1000:1000 o HOME do container (/) nao e gravavel, e matplotlib
      # tenta criar /.config/matplotlib no import de src.utils.functions.
      - HOME=/tmp
      - MPLCONFIGDIR=/tmp/matplotlib
      # Notificacoes continuam opt-in (-notify); vem do .env do host.
      - NOTIFY_WEBHOOK_URL=${NOTIFY_WEBHOOK_URL:-}
    # Escreve em ./etc e ./dataset montados do host. Sem isto os arquivos saem
    # como root e o usuario nao consegue mexer neles depois.
    user: "1000:1000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: '1gb'
    restart: 'no'
    command: ["bash", "run_centralized.sh", "-loc", "all", "-bootstrap", "-jobs", "3"]
